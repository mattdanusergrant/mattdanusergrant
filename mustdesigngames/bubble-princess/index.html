<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2f42">
<title>Bubble Princess</title>
<meta name="description" content="A top-down bubble-powered princess action game: bubble the usurper's goons into harmless frogs that float off in bubbles, pop open every lock with your wand — the palace Master Key — and dance up a bubble storm that heals you and inspires the court.">
<meta property="og:title" content="Bubble Princess">
<meta property="og:description" content="A top-down bubble-powered princess action game: bubble the usurper's goons into harmless frogs that float off in bubbles, pop open every lock with your wand — the palace Master Key — and dance up a bubble storm that heals you and inspires the court.">
<meta property="og:type" content="website">
<!-- Favicon: inline SVG so the build stays single-file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2F42'/%3E%3Ccircle cx='16' cy='19' r='9' fill='rgba(191,234,255,0.18)' stroke='%23BFEAFF' stroke-width='2'/%3E%3Cpath d='M10 13 A 7 7 0 0 1 14 11' stroke='%23FFFFFF' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M11 8 L11 3 L14 6 L16 2 L18 6 L21 3 L21 8 Z' fill='%23FFD34D'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f2f42; --panel: #164257; --ink: #eefaff; --muted: #93bacd;
    --line: #265a74; --accent: #7fe3ff; --bubble: #bfeaff; --ok: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
  }
  /* KBAM-primary shell: wide desktop window; still fills a phone screen. */
  #app { width: 100%; max-width: 980px; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 4px 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .4px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
  button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; cursor: pointer;
  }
  button:active { transform: scale(.96); }
  #mute { width: 40px; padding: 8px 0; text-align: center; }
  #stage { position: relative; flex: 1; margin: 6px 0; border: 1px solid var(--line);
           border-radius: 14px; overflow: hidden; background: var(--panel); min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 0 8px; }
  /* touch-only UI, revealed when a touch pointer is seen */
  #danceBtn {
    position: absolute; right: 14px; bottom: 14px; display: none;
    font-size: 16px; padding: 14px 18px; border-radius: 50px; opacity: .92;
    background: #1b5070; border-color: #2e7196;
  }
  .touch #danceBtn { display: block; }
  /* overlays (game over / victory) */
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8, 24, 38, .84); backdrop-filter: blur(2px); text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay .card { max-width: 420px; }
  #overlay h2 { font-size: 26px; margin: 0 0 8px; color: var(--accent); }
  #overlay p { margin: 6px 0; color: var(--ink); }
  #overlay .sub { color: var(--muted); font-size: 14px; }
  #overlay button { margin-top: 14px; font-size: 16px; padding: 10px 18px; background: #1b5070; border-color: #2e7196; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  @media (max-height: 560px) { header { padding: 6px 4px 2px; } h1 { font-size: 18px; } .hint { display: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bubble Princess</h1>
    <span class="score">★ <span id="score">0</span></span>
    <button id="mute" aria-label="Sound" title="Sound">🔊</button>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="danceBtn">💃 Dance</button>
    <div id="overlay"><div class="card">
      <h2 id="ovTitle"></h2>
      <p id="ovBody"></p>
      <p class="sub" id="ovSub"></p>
      <button id="ovBtn"></button>
    </div></div>
  </div>
  <p class="hint">WASD move — the wand fires by itself · hold SPACE to dance · your wand pops every lock.</p>
</div>

<script>
(() => {
  'use strict';
  const SLUG = 'bubble-princess';              // namespaces this game's saves
  const BEST_KEY = SLUG + '-best';
  const cv = document.getElementById('c');
  let ctx = cv.getContext('2d');           // let: the art exporter briefly retargets it
  const scoreEl = document.getElementById('score');
  const muteBtn = document.getElementById('mute');
  const stage = document.getElementById('stage');
  const danceBtn = document.getElementById('danceBtn');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovBody = document.getElementById('ovBody');
  const ovSub = document.getElementById('ovSub');
  const ovBtn = document.getElementById('ovBtn');

  // --- persistence: always try/catch (private-mode / disabled storage) ---
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}

  // ===================== art pipeline =====================
  // Real art replaces the procedural placeholders file-by-file: drop a PNG named
  // <asset>.png into assets/art/ and list it in assets/art/manifest.json — the game
  // draws that sprite instead; anything unlisted keeps its procedural placeholder.
  // Boxes are the world-px rects each sprite is drawn into (any source resolution
  // scales to fit). Spec + exports for the artist: vault art/ART-SPEC.md.
  const ART_BASE = 'assets/art/';
  const ART_BOX = {
    princess: [40, 48], 'princess-dance': [40, 48],
    guest: [26, 30], 'guest-cheer': [26, 30], 'guest-shield': [26, 30], 'guest-sparkle': [26, 30], 'guest-vigor': [26, 30],
    'frog-bubble': [30, 30], goon: [30, 30], archer: [30, 34], brute: [42, 42], fly: [14, 12],
    bolt: [18, 18], door: [32, 32], 'door-open': [32, 32], exit: [32, 32],
    chest: [32, 32], 'chest-open': [32, 32], cage: [32, 32], 'cage-open': [32, 32],
    'tile-floor': [32, 32], 'tile-floor-alt': [32, 32], 'tile-carpet': [32, 32], 'tile-wall': [32, 32],
    heart: [22, 20], key: [24, 16], lock: [22, 26]
  };
  const ART = {};
  function sprite(name) { const a = ART[name]; return a && a.ok ? a.img : null; }
  function loadArt(name) {
    if (!ART_BOX[name] || ART[name]) return;
    const img = new Image();
    ART[name] = { img, ok: false };
    img.onload = () => { ART[name].ok = true; };
    img.src = ART_BASE + name + '.png';
  }
  try {
    if (location.protocol.indexOf('http') === 0)   // file:// preview: art off, no console noise
      fetch(ART_BASE + 'manifest.json')
        .then(r => (r && r.ok) ? r.json() : null)
        .then(m => { if (m && Array.isArray(m.files)) m.files.forEach(f => loadArt(String(f).replace(/\.png$/i, ''))); })
        .catch(() => {});
  } catch (e) {}
  function spr(name, x, y) {   // draw a sprite centered on (x,y) in its box; true if drawn
    const s = sprite(name);
    if (!s) return false;
    const b = ART_BOX[name];
    ctx.drawImage(s, x - b[0] / 2, y - b[1] / 2, b[0], b[1]);
    return true;
  }

  // --- audio: WebAudio blips, no asset files ---
  let actx = null, muted = false;
  function ac() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
    return actx;
  }
  function tone(freq, dur, type, gain, slideTo) {
    if (muted || !ac()) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'triangle'; o.frequency.value = freq;
      if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, actx.currentTime + dur);
      g.gain.value = gain || 0.05;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    shot()   { tone(320, 0.11, 'sine', 0.05, 760); },
    frog()   { tone(330, 0.22, 'square', 0.05, 110); },
    unlock() { tone(950, 0.05, 'square', 0.04, 300); setTimeout(() => tone(988, 0.16, 'triangle', 0.05), 70); },
    chest()  { tone(784, 0.10, 'triangle', 0.05); setTimeout(() => tone(1175, 0.18, 'triangle', 0.05), 80); },
    hurt()   { tone(150, 0.20, 'sawtooth', 0.06, 90); },
    heal()   { tone(523, 0.14, 'sine', 0.05, 660); },
    inspire(){ [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.05), i * 70)); },
    clear()  { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.06), i * 110)); },
    lose()   { [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.06), i * 160)); }
  };
  let waltzStep = 0, nextWaltz = 0;
  function waltz() {                     // little um-pa-pa while dancing
    if (muted || !ac()) return;
    if (actx.currentTime >= nextWaltz) {
      const seq = [220, 440, 554, 440];
      tone(seq[waltzStep % seq.length], 0.16, 'triangle', 0.035);
      waltzStep++; nextWaltz = actx.currentTime + 0.21;
    }
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // --- crisp canvas on hi-dpi; re-fit on resize/orientation ---
  let W = 0, H = 0, dpr = 1, zoom = 1;
  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    zoom = Math.max(0.8, Math.min(1.8, Math.min(W / 640, H / 420) * 1.15));
  }
  window.addEventListener('resize', fit);

  // ===================== world =====================
  const TS = 32;                          // tile size (world px)
  // Legend: # wall · . floor · , carpet · L locked door · E exit door · C cage · T chest
  //         P player start · g goon · a archer · b brute · f fly (harmless, slows; frog food)
  const MAPS = [
    [ // Floor 1 — The Foyer (doors are double-wide: paired L tiles open together)
      '##############################',
      '#..........#........#........#',
      '#..........#.T......#.......E#',
      '#..P.......#........#........#',
      '#..........#...g....#........#',
      '#..........L........#........#',
      '#..........L........#..f..f..#',
      '#..........#........#........#',
      '#..,,,,,...#........#........#',
      '#..,,,,,g..#........L...g....#',
      '#..,,,,,...#........L........#',
      '#..........#........#........#',
      '#..........#..g.....#........#',
      '#..........#........#........#',
      '#..T.......#........#....C...#',
      '#..........#.....C..#........#',
      '#..........#........#........#',
      '#..........#........#........#',
      '##############################'
    ],
    [ // Floor 2 — The Gallery
      '##############################',
      '#.............#..............#',
      '#.P...........#............C.#',
      '#.............#.......a......#',
      '#.............L..............#',
      '#.............L..............#',
      '#.............#..........g...#',
      '#..........T..#..............#',
      '#.............#..............#',
      '#######LL############LL#######',
      '#....f........#..............#',
      '#.............#......f.......#',
      '#...g.........#...........C..#',
      '#.............#..........f...#',
      '#.............L..............#',
      '#.C...........L.........g....#',
      '#..a........T.#.....T.......E#',
      '#........g....#.......g......#',
      '##############################'
    ],
    [ // Floor 3 — The Throne Gala
      '##############################',
      '#.T........................T.#',
      '#.............E..............#',
      '#........b....,.....b........#',
      '#.............a..............#',
      '#.............,..............#',
      '##############LL##############',
      '#..g..........T............C.#',
      '#.............a..............#',
      '#.......b.....#......b.......#',
      '#......f..............f......#',
      '#.C.......................g..#',
      '######LL##############LL######',
      '#.............T..............#',
      '#...g..................g.....#',
      '#.........f........f.........#',
      '#.C...........P............C.#',
      '#............................#',
      '##############################'
    ]
  ];
  function validateMaps() {
    MAPS.forEach((rows, mi) => {
      const w = rows[0].length;
      rows.forEach((r, ri) => {
        if (r.length !== w) throw new Error('Map ' + (mi + 1) + ' row ' + ri + ' has length ' + r.length + ' (want ' + w + ')');
      });
      const flat = rows.join('');
      const p = (flat.match(/P/g) || []).length, ex = (flat.match(/E/g) || []).length;
      if (p !== 1) throw new Error('Map ' + (mi + 1) + ' has ' + p + ' player starts');
      if (ex !== 1) throw new Error('Map ' + (mi + 1) + ' has ' + ex + ' exits');
    });
  }
  validateMaps();

  // ===================== state =====================
  const HINTS_DESK = {
    move: 'WASD / arrows to move — your wand blows bubbles at goons by itself',
    lock: 'Your wand is the Master Key — walk into any lock to pop it open',
    dance: 'Hold SPACE to dance — it heals you (you waltz at half speed)',
    guest: 'Rescued guests follow you — hold SPACE and they\'ll dance around you!',
    fly: 'Flies slow you down — only your party frogs can eat them!'
  };
  const HINTS_TOUCH = {
    move: 'Drag anywhere to move — the wand blows bubbles by itself',
    lock: 'Your wand is the Master Key — walk into any lock to pop it open',
    dance: 'Hold 💃 Dance to heal (you waltz at half speed)',
    guest: 'Rescued guests follow you — hold 💃 and they\'ll dance around you!',
    fly: 'Flies slow you down — only your party frogs can eat them!'
  };
  let touchMode = false;

  const P = {                              // the princess
    x: 0, y: 0, r: 12, speed: 172,
    hp: 5, maxHp: 5, iframe: 0, aim: 0,
    dancing: false, danceT: 0, healT: 0, pulseT: 0,
    fireCd: 0, twirl: 0
  };
  let floor = 1, tiles = [], cols = 0, rows = 0, specials = {};
  let enemies = [], party = [], flies = [], zaps = [], bolts = [], arrows = [], parts = [], rings = [];
  let shieldUp = false, shieldCd = 0;      // the Shield guest's bubble shield
  let trail = [];                          // player position history for the follow line
  let score = 0, frogCount = 0, guestCount = 0, locksOpened = 0;
  let camX = 0, camY = 0, shake = 0, hurtFlash = 0;
  let state = 'play';                      // play | clear | over | won
  let clearT = 0, runTime = 0;
  let hint = null, hintT = 0; const hintsShown = {};
  let snap = null;                         // floor-start snapshot for retry
  let mg = null;                           // the kid-friendly unlock mini-game
  let danceSpin = 0;                       // rotation of the guests' dance formation

  function showHint(key) {
    if (hintsShown[key]) return;
    hintsShown[key] = true;
    hint = (touchMode ? HINTS_TOUCH : HINTS_DESK)[key]; hintT = 5.2;
  }
  function setScore(n) {
    score = n; scoreEl.textContent = score;
    if (score > best) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
  }
  function roleCount(role) {
    let n = 0; party.forEach(m => { if (m.kind === 'guest' && m.role === role) n++; });
    return n;
  }
  function addScore(n) {   // the Sparkle guest's passive: all pickups worth 1.5×
    setScore(score + (roleCount('sparkle') ? Math.round(n * 1.5) : n));
  }

  function key(c, r) { return r * cols + c; }
  function loadFloor(n, keepParty) {
    floor = n;
    const rowsArr = MAPS[n - 1];
    rows = rowsArr.length; cols = rowsArr[0].length;
    tiles = []; specials = {}; enemies = []; flies = []; zaps = []; bolts = []; arrows = []; parts = []; rings = [];
    const carried = keepParty ? party.slice() : [];
    party = []; trail = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const ch = rowsArr[r][c];
      let t = 0;
      if (ch === '#') t = 1;
      else if (ch === ',') t = 2;
      tiles[key(c, r)] = t;
      const wx = c * TS + TS / 2, wy = r * TS + TS / 2;
      if (ch === 'L') specials[key(c, r)] = { type: 'door', open: false, c, r };
      if (ch === 'E') specials[key(c, r)] = { type: 'exit', open: false, c, r };
      if (ch === 'C') specials[key(c, r)] = { type: 'cage', open: false, c, r };
      if (ch === 'T') specials[key(c, r)] = { type: 'chest', open: false, c, r };
      if (ch === 'P') { P.x = wx; P.y = wy; }
      if (ch === 'g') enemies.push(mkEnemy('goon', wx, wy));
      if (ch === 'a') enemies.push(mkEnemy('archer', wx, wy));
      if (ch === 'b') enemies.push(mkEnemy('brute', wx, wy));
      if (ch === 'f') flies.push({ x: wx, y: wy, wob: Math.random() * 6.28 });
    }
    // the whole party — guests and bubbled frogs — attends the rest of the ball
    carried.forEach(m => { m.x = P.x; m.y = P.y; party.push(m); });
    camX = P.x; camY = P.y;
    P.dancing = false; P.fireCd = 0; P.iframe = 1.0;
    snap = { score, frogCount, guestCount, locksOpened, hp: P.hp, party: party.length };
    state = 'play';
  }
  function mkEnemy(type, x, y) {
    const base = { type, x, y, hx: x, hy: y, vx: 0, vy: 0, wt: 0, wa: Math.random() * 6.28, cd: 1 + Math.random() };
    if (type === 'goon')   return Object.assign(base, { r: 13, speed: 92,  hp: 1, dmg: 1 });
    if (type === 'archer') return Object.assign(base, { r: 12, speed: 78,  hp: 1, dmg: 1 });
    return Object.assign(base, { r: 17, speed: 64, hp: 2, dmg: 2, flash: 0 }); // brute
  }

  // --- grid solidity ---
  function solidTile(c, r) {
    if (c < 0 || r < 0 || c >= cols || r >= rows) return true;
    if (tiles[key(c, r)] === 1) return true;
    const s = specials[key(c, r)];
    return !!(s && !s.open);
  }
  function circleHitsGrid(x, y, rad) {
    const x0 = Math.floor((x - rad) / TS), x1 = Math.floor((x + rad) / TS);
    const y0 = Math.floor((y - rad) / TS), y1 = Math.floor((y + rad) / TS);
    for (let r = y0; r <= y1; r++) for (let c = x0; c <= x1; c++) if (solidTile(c, r)) return true;
    return false;
  }
  function moveCircle(o, dx, dy, rad) {
    if (dx) { const nx = o.x + dx; if (!circleHitsGrid(nx, o.y, rad)) o.x = nx; }
    if (dy) { const ny = o.y + dy; if (!circleHitsGrid(o.x, ny, rad)) o.y = ny; }
  }
  function los(x0, y0, x1, y1) {
    const d = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.floor(d / 10));
    for (let i = 1; i < steps; i++) {
      const x = x0 + (x1 - x0) * i / steps, y = y0 + (y1 - y0) * i / steps;
      if (solidTile(Math.floor(x / TS), Math.floor(y / TS))) return false;
    }
    return true;
  }

  // --- particles ---
  function puff(x, y, n, col, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = (spd || 60) * (0.4 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, max: 0.8, col, kind: 'dot', sz: 2 + Math.random() * 3 });
    }
  }
  function stars(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = 80 * (0.3 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.6 + Math.random() * 0.4, max: 1, col: '#ffd34d', kind: 'star', sz: 3 + Math.random() * 3, rot: Math.random() * 6.28 });
    }
  }
  function note(x, y) {
    parts.push({ x, y, vx: (Math.random() - 0.5) * 30, vy: -55 - Math.random() * 25, life: 0.9, max: 0.9, col: Math.random() < 0.5 ? '#ff9fd6' : '#ffd34d', kind: 'note', sz: 10 });
  }
  function bub(x, y) {   // a dance bubble drifting up
    parts.push({ x, y, vx: (Math.random() - 0.5) * 36, vy: -45 - Math.random() * 30, life: 1.1, max: 1.1, col: '#bfeaff', kind: 'bub', sz: 2.5 + Math.random() * 3.5 });
  }
  function pop(x, y, n) { // a burst bubble: shards + droplets
    for (let i = 0; i < (n || 8); i++) {
      const a = Math.random() * 6.28, s = 70 * (0.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.4 + Math.random() * 0.3, max: 0.7, col: '#dff6ff', kind: 'dot', sz: 1.5 + Math.random() * 2 });
    }
  }

  // --- opening locks (the wand is the Master Key): touching one starts the
  //     kid-friendly unlock mini-game — an ice-slide key puzzle: arrows/swipe send
  //     the key gliding until a bubble or the edge stops it; reach the lock to open.
  //     No fail, no timer, always solvable (generator BFS-verifies) ---
  const MG_DIFF = { door: [1, 2, 3], chest: [2, 3, 4], cage: [2, 3, 4], exit: [2, 3, 6] }; // [minSlides, maxSlides, bubbles]
  const MG_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function slideDest(g, from, dir) {   // glide until edge/bubble; entering the lock wins
    let c = from.c, r = from.r;
    for (;;) {
      const nc = c + dir[0], nr = r + dir[1];
      if (nc < 0 || nr < 0 || nc >= g.cols || nr >= g.rows) break;
      if (g.blocks.has(nc + ',' + nr)) break;
      c = nc; r = nr;
      if (c === g.lock.c && r === g.lock.r) return { c, r, hitLock: true };
    }
    return { c, r, hitLock: false };
  }
  function solveSlide(g) {             // BFS over slides; shortest dir list into the lock
    const prev = {}; prev[g.key.c + ',' + g.key.r] = null;
    const q = [{ c: g.key.c, r: g.key.r }];
    while (q.length) {
      const cur = q.shift();
      for (const dir of MG_DIRS) {
        const d = slideDest(g, cur, dir);
        if (d.hitLock) {
          const path = [dir];
          let k = cur.c + ',' + cur.r;
          while (prev[k]) { path.unshift(prev[k].dir); k = prev[k].from; }
          return path;
        }
        const dk = d.c + ',' + d.r;
        if ((d.c !== cur.c || d.r !== cur.r) && !(dk in prev)) {
          prev[dk] = { from: cur.c + ',' + cur.r, dir };
          q.push({ c: d.c, r: d.r });
        }
      }
    }
    return null;
  }
  function genSlide(type) {
    const [minD, maxD, nBlocks] = MG_DIFF[type] || MG_DIFF.door;
    const cols = 7, rows = 4;
    let best = null;
    for (let t = 0; t < 80; t++) {
      const g = { cols, rows, blocks: new Set() };
      const cells = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ c, r });
      cells.sort(() => Math.random() - 0.5);
      g.key = { c: cells[0].c, r: cells[0].r };
      g.lock = { c: cells[1].c, r: cells[1].r };
      for (let b = 0; b < nBlocks; b++) g.blocks.add(cells[2 + b].c + ',' + cells[2 + b].r);
      const sol = solveSlide(g);
      if (!sol) continue;
      g.solution = sol;
      if (sol.length >= minD && sol.length <= maxD) return g;
      if (!best || Math.abs(sol.length - minD) < Math.abs(best.solution.length - minD)) best = g;
    }
    if (best) return best;
    // ultimate fallback: a straight lane
    const g = { cols, rows, blocks: new Set(), key: { c: 0, r: 1 }, lock: { c: cols - 1, r: 1 }, solution: [[1, 0]] };
    return g;
  }
  const REACH = 16;                        // generous interact reach beyond the princess
  function tryOpenSpecials() {
    const pad = P.r + REACH + 2;
    const c0 = Math.floor((P.x - pad) / TS), c1 = Math.floor((P.x + pad) / TS);
    const r0 = Math.floor((P.y - pad) / TS), r1 = Math.floor((P.y + pad) / TS);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const s = specials[key(c, r)];
      if (!s || s.open) continue;
      const nx = Math.max(c * TS, Math.min(P.x, c * TS + TS)), ny = Math.max(r * TS, Math.min(P.y, r * TS + TS));
      if (Math.hypot(P.x - nx, P.y - ny) > P.r + REACH) continue;
      startUnlock(s);
      return;
    }
  }
  function startUnlock(s) {
    state = 'unlock';
    const pw = Math.min(W - 30, 430), ph = Math.min(H - 90, 310);
    const px = (W - pw) / 2, py = (H - ph) / 2 + 10;
    const g = genSlide(s.type);
    const cell = Math.floor(Math.min((pw - 36) / g.cols, (ph - 104) / g.rows));
    const gx = Math.round(px + (pw - cell * g.cols) / 2);
    const gy = Math.round(py + 58 + (ph - 104 - cell * g.rows) / 2);
    mg = { s, g, cell, gx, gy, panel: { x: px, y: py, w: pw, h: ph },
           kx: g.key.c, ky: g.key.r, anim: null, moves: 0, done: false, doneT: 0, sparks: [], swipe: null };
    tone(523, 0.1, 'triangle', 0.05, 784);
  }
  function mgSlide(dir) {
    if (!mg || mg.done || mg.anim) return;
    const d = slideDest(mg.g, mg.g.key, dir);
    if (d.c === mg.g.key.c && d.r === mg.g.key.r && !d.hitLock) { tone(160, 0.06, 'square', 0.04); return; }
    const dist = Math.abs(d.c - mg.g.key.c) + Math.abs(d.r - mg.g.key.r);
    mg.anim = { fc: mg.g.key.c, fr: mg.g.key.r, tc: d.c, tr: d.r, t: 0, dur: 0.06 + dist * 0.04, hitLock: d.hitLock };
    mg.g.key = { c: d.c, r: d.r };
    mg.moves++;
    tone(340, 0.1, 'sine', 0.045, 620);
  }
  function updateUnlock(dt) {
    if (mg.anim) {
      const a = mg.anim;
      a.t += dt;
      const p = Math.min(1, a.t / a.dur);
      mg.kx = a.fc + (a.tc - a.fc) * p;
      mg.ky = a.fr + (a.tr - a.fr) * p;
      if (Math.random() < dt * 30) mg.sparks.push({ x: mg.gx + (mg.kx + 0.5) * mg.cell, y: mg.gy + (mg.ky + 0.5) * mg.cell, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, life: 0.35 });
      if (p >= 1) {
        const hit = a.hitLock;
        mg.anim = null;

          for (let i = 0; i < 18; i++) {
            const an = Math.random() * 6.28, sp = 110 * (0.4 + Math.random());

  function finishUnlock(s) {

      sfx.unlock(); addScore(5);
      // double-wide doors: the adjacent linked panel swings open with this one
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
        const p2 = specials[key(s.c + dc, s.r + dr)];
        if (p2 && !p2.open && p2.type === 'door') {
          p2.open = true;

    else if (s.type === 'chest') {

    else if (s.type === 'cage') {

      const ROLES = [
        { role: 'cheer',   hue: '#f2a2c4', label: '+ Cheer! (faster wand)' },
        { role: 'shield',  hue: '#a2c8f2', label: '+ Shield! (blocks a hit)' },
        { role: 'sparkle', hue: '#f2d3a2', label: '+ Sparkle! (1.5× score)' },
        { role: 'vigor',   hue: '#b8f2a2', label: '+ Vigor! (faster healing)' }
      ];
      const R = ROLES[roleCount('cheer') + roleCount('shield') + roleCount('sparkle') + roleCount('vigor') & 3];
      party.push({ kind: 'guest', role: R.role, hue: R.hue, x: wx, y: wy, bob: Math.random() * 6.28 });
      guestCount++; addScore(25); stars(wx, wy, 8);

  // ===================== input =====================
  const keys = new Set();
  const DIR_KEYS = { ArrowRight: [1, 0], d: [1, 0], ArrowLeft: [-1, 0], a: [-1, 0], ArrowDown: [0, 1], s: [0, 1], ArrowUp: [0, -1], w: [0, -1] };
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  window.addEventListener('keyup', (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  window.addEventListener('blur', () => keys.clear());

  // the wand aims and fires by itself — pointers only steer (touch stick) and pop mini-game bubbles
  let stickId = null, stickOx = 0, stickOy = 0, stickDx = 0, stickDy = 0;
  let danceHeld = false;

  function stagePos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('pointerdown', (e) => {
    ac();

    if (e.pointerType === 'touch' && !touchMode) { touchMode = true; document.body.classList.add('touch'); }

  // ===================== update =====================
  function hurt(dmg, fx, fy) {

  function fireBolt() {
    if (P.fireCd > 0 || P.dancing) return;

  function update(dt) {

    if (state !== 'play') return;
    runTime += dt;

    // --- player ---
    let ix = 0, iy = 0;
    if (keys.has('w') || keys.has('ArrowUp')) iy -= 1;
    if (keys.has('s') || keys.has('ArrowDown')) iy += 1;

      const d = Math.hypot(en.x - P.x, en.y - P.y);

    // follow trail — only extended while actually moving, so guests hold a

    if (ltx === undefined || Math.hypot(P.x - ltx, P.y - lty) > 2) {
      trail.push(P.x, P.y);
      if (trail.length > 1400) trail.splice(0, trail.length - 1400);

    // hint triggers
    if (floor === 1) {
      showHint('move');
      for (const k2 in specials) {
        const s = specials[k2];
        if (!s.open && (s.type === 'door' || s.type === 'chest' || s.type === 'cage')) {

    // --- enemies ---
    enemies.forEach(en => {

      let mvx = 0, mvy = 0;

        if (sees) {

    // --- bolts (bubbles) ---
    bolts = bolts.filter(b => {
      b.life -= dt; b.rot += dt * 14;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.random() < dt * 16) parts.push({ x: b.x, y: b.y, vx: 0, vy: -20, life: 0.3, max: 0.3, col: '#bfeaff', kind: 'bub', sz: 1.5 });
      if (b.life <= 0) { pop(b.x, b.y, 5); return false; }
      if (solidTile(Math.floor(b.x / TS), Math.floor(b.y / TS))) { pop(b.x, b.y, 6); return false; }
      for (let i = 0; i < enemies.length; i++) {
        const en = enemies[i];
        if (Math.hypot(en.x - b.x, en.y - b.y) < en.r + 5) {
          en.hp--; en.flash = 0.15;
          if (en.hp <= 0) {
            enemies.splice(i, 1);
            party.push({ kind: 'frog', x: en.x, y: en.y, bob: Math.random() * 6.28, eatT: 0 });
            frogCount++; addScore(10);
            sfx.frog(); puff(en.x, en.y, 10, '#7de07a', 90); pop(en.x, en.y, 10);

          } else { pop(b.x, b.y, 6); }
          return false;
        }
      }
      return true;
    });

    // --- arrows ---
    arrows = arrows.filter(a => {
      a.life -= dt; a.x += a.vx * dt; a.y += a.vy * dt;
      if (a.life <= 0) return false;
      if (solidTile(Math.floor(a.x / TS), Math.floor(a.y / TS))) return false;
      if (Math.hypot(a.x - P.x, a.y - P.y) < P.r + 3) { hurt(1, a.x - a.vx, a.y - a.vy); return false; }
      return true;
    });

    // --- flies: harmless, but they swarm the princess and slow her down ---
    flies.forEach(fl => {
      fl.wob += dt;
      const d = Math.hypot(P.x - fl.x, P.y - fl.y);
      if (d < 320) {
        const a = Math.atan2(P.y - fl.y, P.x - fl.x) + Math.sin(fl.wob * 3.1) * 0.9;
        const sp = d > 46 ? 120 : 60;     // buzz in, then circle annoyingly
        fl.x += Math.cos(a) * sp * dt; fl.y += Math.sin(a) * sp * dt;
      } else {
        fl.x += Math.cos(fl.wob * 1.7) * 26 * dt; fl.y += Math.sin(fl.wob * 2.3) * 26 * dt;
      }
    });
    // --- party frogs eat flies (the ONLY way flies go away) ---
    party.forEach(m => {
      if (m.kind !== 'frog') return;
      m.eatT -= dt;
      if (m.eatT > 0) return;
      for (let i = 0; i < flies.length; i++) {
        const fl = flies[i];
        if (Math.hypot(fl.x - m.x, fl.y - m.y) < 72) {
          zaps.push({ x1: m.x, y1: m.y - 2, x2: fl.x, y2: fl.y, t: 0.14 });
          flies.splice(i, 1);
          m.eatT = 1.1;
          addScore(5);
          tone(700, 0.06, 'square', 0.05, 200); puff(fl.x, fl.y, 5, '#9fb3c8', 60);
          break;
        }
      }
    });
    zaps = zaps.filter(z => (z.t -= dt) > 0);

    // --- guests: every rescued guest follows close behind; while the princess
    //     dances they fan out into a slowly orbiting ring and dance around her ---
    if (P.dancing && party.length) {
      danceSpin += dt * 1.1;
      const n = party.length;
      party.forEach((m, i) => {
        const rad = n > 8 ? 44 + 24 * (i % 2) : 44;
        const a = danceSpin + i * 6.283 / n;
        const tx = P.x + Math.cos(a) * rad, ty = P.y + Math.sin(a) * rad;
        m.x += (tx - m.x) * Math.min(1, dt * 8); m.y += (ty - m.y) * Math.min(1, dt * 8);
        m.bob += dt * 9;
        if (Math.random() < dt * 1.6) note(m.x, m.y - 12);
        if (Math.random() < dt * 2.5) bub(m.x, m.y - 8);
      });
    } else {
      party.forEach((m, i) => {
        // trail holds x,y PAIRS — the look-back offset must stay even or a member
        // reads y-as-x and teleports (the vanishing-guest bug, fixed 2026-07-30)
        const idx = trail.length - 2 - (i + 1) * 16 - 6;
        const tx = idx >= 0 ? trail[idx] : trail[0], ty = idx >= 0 ? trail[idx + 1] : trail[1];
        if (tx !== undefined) { m.x += (tx - m.x) * Math.min(1, dt * 10); m.y += (ty - m.y) * Math.min(1, dt * 10); }
        m.bob += dt * 6;
        if (m.kind === 'guest' && Math.random() < dt * 0.4) note(m.x, m.y - 12);
      });
    }

    // --- particles & rings ---
    parts = parts.filter(p => {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - dt * 2);
      p.vy = (p.kind === 'note' || p.kind === 'bub' || p.kind === 'amb' || p.kind === 'label') ? p.vy : p.vy + 60 * dt;
      return p.life > 0;
    });
    // ambient palace bubbles drifting up through the visible rooms
    if (Math.random() < dt * 3) {
      const ax = camX + (Math.random() - 0.5) * (W / zoom), ay = camY + (Math.random() - 0.5) * (H / zoom);
      if (!solidTile(Math.floor(ax / TS), Math.floor(ay / TS)))
        parts.push({ x: ax, y: ay, vx: (Math.random() - 0.5) * 8, vy: -12 - Math.random() * 10, life: 2.5, max: 2.5, col: 'rgba(191,234,255,.5)', kind: 'amb', sz: 1.5 + Math.random() * 2.5 });
    }
    rings = rings.filter(r => { r.life -= dt; r.r += (r.max - r.r) * dt * 6; return r.life > 0; });

    // --- camera ---
    shake = Math.max(0, shake - dt * 18);
    const vw = W / zoom, vh = H / zoom;
    let tx = P.x, ty = P.y;
    const mw = cols * TS, mh = rows * TS;
    tx = Math.max(vw / 2, Math.min(mw - vw / 2, tx));
    ty = Math.max(vh / 2, Math.min(mh - vh / 2, ty));
    if (mw < vw) tx = mw / 2;
    if (mh < vh) ty = mh / 2;
    camX += (tx - camX) * Math.min(1, dt * 7);
    camY += (ty - camY) * Math.min(1, dt * 7);
  }

  // ===================== render =====================
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.translate(-camX + sx, -camY + sy);

    // visible tile range
    const vw = W / zoom, vh = H / zoom;
    const c0 = Math.max(0, Math.floor((camX - vw / 2) / TS) - 1), c1 = Math.min(cols - 1, Math.ceil((camX + vw / 2) / TS) + 1);
    const r0 = Math.max(0, Math.floor((camY - vh / 2) / TS) - 1), r1 = Math.min(rows - 1, Math.ceil((camY + vh / 2) / TS) + 1);

    // floors
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const t = tiles[key(c, r)];
      const x = c * TS, y = r * TS;
      if (t === 1) continue;
      drawFloorTile(x, y, (c + r) & 1);
      if (t === 2) drawCarpetTile(x, y);
    }
    // specials (under actors)
    for (const k2 in specials) drawSpecial(specials[k2]);
    // walls
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tiles[key(c, r)] !== 1) continue;
      drawWallTile(c * TS, r * TS, !solidTile(c, r + 1));
    }

    party.forEach(m => m.kind === 'frog' ? drawFrog(m) : drawGuest(m));
    enemies.forEach(drawEnemy);
    flies.forEach(drawFly);
    drawPrincess();
    zaps.forEach(z => {   // frog tongues
      ctx.strokeStyle = '#ff7d9d'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(z.x1, z.y1); ctx.lineTo(z.x2, z.y2); ctx.stroke();
      ctx.lineCap = 'butt';
    });

    // bolts (bubbles) & arrows
    bolts.forEach(b => {
      if (sprite('bolt')) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(b.rot) * 0.25);
        spr('bolt', 0, 0); ctx.restore();
      } else drawBubble(b.x, b.y, 6.5 + Math.sin(b.rot) * 1.2, 0.9);
    });
    ctx.strokeStyle = '#d8c9a3'; ctx.lineWidth = 2;
    arrows.forEach(a => {
      const l = 10, ang = Math.atan2(a.vy, a.vx);
      ctx.beginPath(); ctx.moveTo(a.x - Math.cos(ang) * l, a.y - Math.sin(ang) * l); ctx.lineTo(a.x, a.y); ctx.stroke();
    });

    // rings & particles
    rings.forEach(r => {
      ctx.strokeStyle = 'rgba(191,234,255,' + (r.life * 1.4) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (r.life * 0.7) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, -2.2, -1.2); ctx.stroke(); // bubble sheen
    });
    parts.forEach(p => {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.kind === 'star') drawStar(p.x, p.y, p.sz, p.col, p.rot || 0);
      else if (p.kind === 'note') { ctx.fillStyle = p.col; ctx.font = 'bold ' + p.sz + 'px system-ui'; ctx.fillText('♪', p.x, p.y); }
      else if (p.kind === 'label') {
        ctx.fillStyle = p.col; ctx.font = '700 ' + p.sz + 'px system-ui'; ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(8,24,38,.8)'; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y); ctx.textAlign = 'left';
      }
      else if (p.kind === 'bub' || p.kind === 'amb') {
        ctx.strokeStyle = p.col; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.283); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.arc(p.x - p.sz * 0.35, p.y - p.sz * 0.35, Math.max(0.6, p.sz * 0.2), 0, 6.283); ctx.fill();
      }
      else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.283); ctx.fill(); }
      ctx.globalAlpha = 1;
    });

    ctx.restore();

    // ---- HUD (screen space) ----
    for (let i = 0; i < P.maxHp; i++) drawHeart(20 + i * 24, 22, i < P.hp);
    ctx.textAlign = 'right'; ctx.fillStyle = '#f4eefc'; ctx.font = '600 14px system-ui';
    ctx.fillText('🐸 ' + frogCount + '   👗 ' + guestCount + '   floor ' + floor + '/' + MAPS.length, W - 14, 26);
    ctx.textAlign = 'left';
    if (hint && hintT > 0) {
      ctx.globalAlpha = Math.min(1, hintT);
      ctx.font = '600 15px system-ui'; ctx.textAlign = 'center';
      const tw = ctx.measureText(hint).width;
      ctx.fillStyle = 'rgba(20,10,38,.75)';
      ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 12, 40, tw + 24, 30, 8); ctx.fill();
      ctx.fillStyle = '#ffd34d'; ctx.fillText(hint, W / 2, 60);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
    if (state === 'clear') {
      ctx.globalAlpha = Math.min(1, (1.4 - clearT) * 2);
      ctx.fillStyle = 'rgba(20,10,38,.6)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd34d'; ctx.font = '700 26px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Floor ' + floor + ' cleared — onward!', W / 2, H / 2);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(255,40,80,' + hurtFlash * 0.6 + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // touch stick
    if (touchMode && stickId !== null) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(stickOx, stickOy, 48, 0, 6.283); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(stickOx + stickDx * 48, stickOy + stickDy * 48, 18, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '12px system-ui';
    ctx.fillText('best ' + best, 10, H - 10);
    if (state === 'unlock' && mg) drawUnlock();
  }

  function drawKeyGlyph(x, y) {
    if (spr('key', x + 2, y + 1)) return;
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x - 6, y, 4.5, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 1, y); ctx.lineTo(x + 10, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 5, y); ctx.lineTo(x + 5, y + 5); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, y + 5); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  function drawPadlock(cx, cy) {
    if (spr('lock', cx, cy)) return;
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy - 4, 6, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#ffd34d';
    ctx.fillRect(cx - 8, cy - 3, 16, 14);
    ctx.fillStyle = '#12384e'; ctx.fillRect(cx - 1.5, cy + 1, 3, 6);
  }
  function drawUnlock() {
    const p = mg.panel, g = mg.g;
    ctx.fillStyle = 'rgba(8,24,38,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#12384e'; ctx.strokeStyle = '#2e7196'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd34d'; ctx.textAlign = 'center';
    ctx.font = '700 ' + (p.w < 380 ? 15 : 18) + 'px system-ui';
    ctx.fillText('🔑 Slide the key to the lock!', p.x + p.w / 2, p.y + 30);
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.font = '600 12px system-ui';
    ctx.fillText(mg.done ? 'Open!' : (touchMode ? 'swipe to slide' : 'arrow keys / WASD to slide'), p.x + p.w / 2, p.y + 48);
    ctx.textAlign = 'left';
    for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
      ctx.strokeStyle = 'rgba(191,234,255,.14)'; ctx.lineWidth = 1;
      ctx.strokeRect(mg.gx + c * mg.cell + 1, mg.gy + r * mg.cell + 1, mg.cell - 2, mg.cell - 2);
    }
    const t = performance.now() / 400;
    g.blocks.forEach(b => {
      const cr = b.split(',');
      drawBubble(mg.gx + (+cr[0] + 0.5) * mg.cell, mg.gy + (+cr[1] + 0.5) * mg.cell + Math.sin(t + +cr[0] + +cr[1]) * 1.5, mg.cell * 0.36);
    });
    drawPadlock(mg.gx + (g.lock.c + 0.5) * mg.cell, mg.gy + (g.lock.r + 0.5) * mg.cell);
    if (!mg.done) {
      ctx.save();
      ctx.translate(mg.gx + (mg.kx + 0.5) * mg.cell, mg.gy + (mg.ky + 0.5) * mg.cell);
      drawKeyGlyph(-2, 0);
      ctx.restore();
    }
    mg.sparks.forEach(sp => {
      ctx.globalAlpha = Math.max(0, sp.life * 2);
      ctx.fillStyle = '#dff6ff';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 2.2, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function drawFloorTile(x, y, alt) {
    const s = sprite(alt ? 'tile-floor-alt' : 'tile-floor') || sprite('tile-floor');
    if (s) return ctx.drawImage(s, x, y, TS, TS);
    ctx.fillStyle = alt ? '#173d54' : '#194159';
    ctx.fillRect(x, y, TS, TS);
  }
  function drawCarpetTile(x, y) {
    const s = sprite('tile-carpet');
    if (s) return ctx.drawImage(s, x, y, TS, TS);
    ctx.fillStyle = '#8c3a64';
    ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
    ctx.fillStyle = 'rgba(255,214,235,.4)';
    ctx.fillRect(x + 3, y + 3, TS - 6, 1); ctx.fillRect(x + 3, y + TS - 4, TS - 6, 1);
  }
  function drawWallTile(x, y, openBelow) {
    const s = sprite('tile-wall');
    if (s) return ctx.drawImage(s, x, y, TS, TS);
    ctx.fillStyle = '#2b5a77'; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#356c8d'; ctx.fillRect(x, y, TS, 5);
    if (openBelow) { ctx.fillStyle = '#0f2f42'; ctx.fillRect(x, y + TS - 3, TS, 3); }
  }
  function drawSpecial(s) {
    const x = s.c * TS, y = s.r * TS, cx = x + TS / 2, cy = y + TS / 2;
    if (s.type === 'door' || s.type === 'exit') {
      if (s.open) { // open arch: floor + posts
        if (spr('door-open', cx, cy)) return;
        ctx.fillStyle = '#2c2148'; ctx.fillRect(x, y, TS, TS);
        ctx.fillStyle = '#6b5432'; ctx.fillRect(x, y, 4, TS); ctx.fillRect(x + TS - 4, y, 4, TS);
        return;
      }
      if (spr(s.type === 'exit' ? 'exit' : 'door', cx, cy)) {
        if (s.type === 'exit') { // keep the go-here sparkle over real art too
          const t = performance.now() / 300 + s.c;
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t);
          drawStar(cx + 9, cy - 9, 4, '#ffd34d', t);
          ctx.globalAlpha = 1;
        }
        return;
      }
      ctx.fillStyle = s.type === 'exit' ? '#8a6a2f' : '#6b4a2a';
      ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
      ctx.fillStyle = s.type === 'exit' ? '#a8863f' : '#7d5a36';
      ctx.fillRect(x + 4, y + 4, TS - 8, TS - 8);

      ctx.fillStyle = '#ffd34d';
      ctx.fillRect(cx - 5, cy - 2, 10, 9);
      ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy - 3, 4, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#6b4a2a'; ctx.fillRect(cx - 1, cy + 1, 2, 4);
      if (s.type === 'exit') { // sparkle to telegraph "go here"
        const t = performance.now() / 300 + s.c;
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t);
        drawStar(cx + 9, cy - 9, 4, '#ffd34d', t);
        ctx.globalAlpha = 1;
      }

      if (s.open) {
        if (spr('cage-open', cx, cy)) return;
        ctx.strokeStyle = '#8f86a8'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 6, y + 20, TS - 12, 8); // collapsed bars
        return;
      }
      if (spr('cage', cx, cy)) return;
      ctx.strokeStyle = '#a99ec4'; ctx.lineWidth = 2;
      ctx.strokeRect(x + 5, y + 3, TS - 10, TS - 6);
      for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 5 + i * (TS - 10) / 4, y + 3); ctx.lineTo(x + 5 + i * (TS - 10) / 4, y + TS - 3); ctx.stroke(); }
      // little guest inside
      ctx.fillStyle = '#f2a2c4'; ctx.beginPath(); ctx.arc(cx, cy + 4, 5, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffd34d'; ctx.fillRect(cx - 4, cy - 6, 8, 3);
    } else if (s.type === 'chest') {
      if (s.open) {
        if (spr('chest-open', cx, cy)) return;
        ctx.fillStyle = '#5a4426'; ctx.fillRect(x + 6, y + 12, TS - 12, 12);
        return;
      }
      if (spr('chest', cx, cy)) return;
      ctx.fillStyle = '#7a5c33'; ctx.fillRect(x + 5, y + 8, TS - 10, 16);
      ctx.fillStyle = '#93733f'; ctx.fillRect(x + 5, y + 8, TS - 10, 6);
      ctx.fillStyle = '#ffd34d'; ctx.fillRect(cx - 2, y + 12, 4, 6);
    }
  }
  function drawBubble(x, y, r, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = 'rgba(191,234,255,.22)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r * 0.65, -2.4, -1.3); ctx.stroke(); // shine
    ctx.globalAlpha = 1;
  }
  function drawStar(x, y, r, col, rot, halo) {
    if (halo) { ctx.fillStyle = halo; ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r, a = (rot || 0) + i * Math.PI / 5;
      ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }
  function drawHeart(x, y, full) {
    if (sprite('heart')) {
      ctx.globalAlpha = full ? 1 : 0.22;
      spr('heart', x, y);
      ctx.globalAlpha = 1;
      return;
    }
    ctx.fillStyle = full ? '#ff5f87' : 'rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.moveTo(x, y + 6);
    ctx.bezierCurveTo(x - 9, y - 3, x - 5, y - 10, x, y - 4);
    ctx.bezierCurveTo(x + 5, y - 10, x + 9, y - 3, x, y + 6);
    ctx.fill();
  }
  function drawPrincess() {
    const blink = P.iframe > 0 && Math.floor(P.iframe * 12) % 2 === 0;
    if (blink) return;
    const x = P.x, y = P.y;
    const spin = P.dancing ? Math.cos(P.twirl) : 1;      // twirl squish
    const ps = P.dancing ? (sprite('princess-dance') || sprite('princess')) : sprite('princess');
    if (ps) {
      const b = ART_BOX[P.dancing && sprite('princess-dance') ? 'princess-dance' : 'princess'];
      ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.25, Math.abs(spin)), 1);
      ctx.drawImage(ps, -b[0] / 2, -b[1] / 2 - 4, b[0], b[1]);
      ctx.restore();
      drawWandAndShield(x, y);
      return;
    }
    ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.25, Math.abs(spin)), 1);
    // bubble gown: pearl-aqua with a pink sheen and a bubble-scalloped hem
    ctx.fillStyle = '#bfe6f2';
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(11, 12); ctx.quadraticCurveTo(0, 16, -11, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,159,214,.45)';
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(7, 9); ctx.quadraticCurveTo(0, 12, -3, 9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 7, 12.5, 3.2, 0, 6.283); ctx.stroke(); } // bubble hem
    // head
    ctx.fillStyle = '#ffd9b8'; ctx.beginPath(); ctx.arc(0, -10, 6, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#6e4a2f'; ctx.beginPath(); ctx.arc(0, -12, 6, Math.PI, 0); ctx.fill();
    // crown
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(-5, -20); ctx.lineTo(-2, -16.5); ctx.lineTo(0, -21); ctx.lineTo(2, -16.5); ctx.lineTo(5, -20); ctx.lineTo(5, -15); ctx.closePath(); ctx.fill();
    ctx.restore();
    drawWandAndShield(x, y);
  }
  function drawWandAndShield(x, y) {   // gameplay overlays stay procedural over any art
    if (shieldUp) drawBubble(x, y - 2, 21, 0.55);   // the Shield guest's bubble
    // bubble wand: a stem ending in the ring you blow bubbles through
    const wx = x + Math.cos(P.aim) * 17, wy = y + Math.sin(P.aim) * 17;
    ctx.strokeStyle = '#e8dcc8'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(P.aim) * 5, y + Math.sin(P.aim) * 5); ctx.lineTo(wx, wy); ctx.stroke();
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(wx + Math.cos(P.aim) * 4, wy + Math.sin(P.aim) * 4, 4.5, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(191,234,255,.35)';
    ctx.beginPath(); ctx.arc(wx + Math.cos(P.aim) * 4, wy + Math.sin(P.aim) * 4, 3.5, 0, 6.283); ctx.fill();
  }
  function drawEnemy(en) {
    const x = en.x, y = en.y;
    if (en.flash > 0) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, en.r + 2, 0, 6.283); ctx.fill(); return; }
    if (spr(en.type, x, y)) {
      if (en.type === 'brute' && en.hp > 1) { ctx.fillStyle = '#ffd34d'; ctx.fillRect(x - 8, y - 22, 16, 3); }
      return;
    }
    if (en.type === 'goon') {
      ctx.fillStyle = '#6b7f5e'; ctx.beginPath(); ctx.arc(x, y, 13, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#57684c'; ctx.beginPath(); ctx.arc(x, y - 5, 10, Math.PI, 0); ctx.fill(); // helmet
      ctx.fillStyle = '#1c140f'; ctx.fillRect(x - 5, y - 1, 3, 3); ctx.fillRect(x + 2, y - 1, 3, 3);
    } else if (en.type === 'archer') {
      ctx.fillStyle = '#3f8f8f'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2e6a6a'; ctx.beginPath(); ctx.moveTo(x - 8, y - 4); ctx.lineTo(0 + x, y - 16); ctx.lineTo(x + 8, y - 4); ctx.closePath(); ctx.fill(); // hood
      ctx.strokeStyle = '#d8c9a3'; ctx.lineWidth = 2;
      const a = Math.atan2(P.y - y, P.x - x);
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 10, y + Math.sin(a) * 10, 6, a - 1.2, a + 1.2); ctx.stroke(); // bow
      ctx.fillStyle = '#0f1c1c'; ctx.fillRect(x - 4, y - 2, 3, 3); ctx.fillRect(x + 2, y - 2, 3, 3);
    } else { // brute
      ctx.fillStyle = '#8a5a3a'; ctx.beginPath(); ctx.arc(x, y, 17, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#a06a45'; ctx.beginPath(); ctx.arc(x, y - 6, 13, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#5c3b25'; ctx.beginPath(); ctx.arc(x - 12, y + 2, 7, 0, 6.283); ctx.fill(); // shield
      ctx.fillStyle = '#20130b'; ctx.fillRect(x - 6, y - 2, 4, 4); ctx.fillRect(x + 3, y - 2, 4, 4);
      if (en.hp > 1) { ctx.fillStyle = '#ffd34d'; ctx.fillRect(x - 8, y - 22, 16, 3); }
    }
  }
  function drawFrog(f) {
    const dy = Math.sin(f.bob) * 2.5;   // the frog bobs gently inside its bubble
    if (spr('frog-bubble', f.x, f.y + dy * 0.6)) return;
    ctx.save(); ctx.translate(f.x, f.y + dy);
    ctx.fillStyle = '#59c94f'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 5.5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#7de07a'; ctx.beginPath(); ctx.arc(-3.5, -4.5, 2.6, 0, 6.283); ctx.arc(3.5, -4.5, 2.6, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#0c2a0a'; ctx.beginPath(); ctx.arc(-3.5, -4.5, 1.2, 0, 6.283); ctx.arc(3.5, -4.5, 1.2, 0, 6.283); ctx.fill();
    ctx.restore();
    drawBubble(f.x, f.y + dy * 0.4, 12 + Math.sin(f.bob * 0.7) * 0.8);
  }
  const ROLE_GLYPH = { cheer: '♪', shield: '◯', sparkle: '★', vigor: '♥' };
  function drawGuest(g) {
    const x = g.x, y = g.y + Math.sin(g.bob) * (P.dancing ? 3 : 1.5);
    if (spr('guest-' + g.role, x, y) || spr('guest', x, y)) return;
    ctx.fillStyle = g.hue;
    ctx.beginPath(); ctx.moveTo(0 + x, y - 4); ctx.lineTo(x + 8, y + 10); ctx.quadraticCurveTo(x, y + 13, x - 8, y + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd9b8'; ctx.beginPath(); ctx.arc(x, y - 8, 5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b5070'; ctx.beginPath(); ctx.arc(x, y - 10, 5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 10px system-ui';
    ctx.fillText(ROLE_GLYPH[g.role] || '★', x + 6, y - 14);
  }
  function drawFly(fl) {
    if (spr('fly', fl.x, fl.y)) return;
    const wob = Math.sin(fl.wob * 30);
    ctx.fillStyle = 'rgba(200,225,255,.55)';
    ctx.beginPath();
    ctx.ellipse(fl.x - 3, fl.y - 3 + wob, 3.2, 1.6, -0.5, 0, 6.283);
    ctx.ellipse(fl.x + 3, fl.y - 3 - wob, 3.2, 1.6, 0.5, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = '#252c33';
    ctx.beginPath(); ctx.ellipse(fl.x, fl.y, 4, 3, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#cfe3f2'; ctx.fillRect(fl.x - 2.5, fl.y - 1.5, 1.6, 1.6); ctx.fillRect(fl.x + 1, fl.y - 1.5, 1.6, 1.6);
  }

  // ===================== art exporter =====================
  // Renders each placeholder standalone (same draw code, fabricated state) so the
  // artist gets exact reference PNGs. Driven headless by the vault's export script.
  function withP(px, py, aim, dancing, fn) {
    const sx = P.x, sy = P.y, sa = P.aim, sd = P.dancing, st = P.twirl, si = P.iframe, sh = shieldUp;
    P.x = px; P.y = py; P.aim = aim; P.dancing = dancing; P.twirl = 0.55; P.iframe = 0; shieldUp = false;
    try { fn(); } finally { P.x = sx; P.y = sy; P.aim = sa; P.dancing = sd; P.twirl = st; P.iframe = si; shieldUp = sh; }
  }
  function tilePaint(type, open) {
    return (cx, cy) => {
      ctx.save(); ctx.translate(cx - TS / 2, cy - TS / 2);
      drawSpecial({ type, open, c: 0, r: 0 });
      ctx.restore();
    };
  }
  const EXPORT_RENDER = {
    'princess':       { w: 40, h: 48, paint: (cx, cy) => withP(cx, cy + 6, -2.2, false, drawPrincess) },
    'princess-dance': { w: 40, h: 48, paint: (cx, cy) => withP(cx, cy + 6, -2.2, true, drawPrincess) },
    'guest-cheer':    { w: 26, h: 30, paint: (cx, cy) => drawGuest({ x: cx, y: cy + 2, hue: '#f2a2c4', role: 'cheer', bob: 0.6 }) },
    'guest-shield':   { w: 26, h: 30, paint: (cx, cy) => drawGuest({ x: cx, y: cy + 2, hue: '#a2c8f2', role: 'shield', bob: 0.6 }) },
    'guest-sparkle':  { w: 26, h: 30, paint: (cx, cy) => drawGuest({ x: cx, y: cy + 2, hue: '#f2d3a2', role: 'sparkle', bob: 0.6 }) },
    'guest-vigor':    { w: 26, h: 30, paint: (cx, cy) => drawGuest({ x: cx, y: cy + 2, hue: '#b8f2a2', role: 'vigor', bob: 0.6 }) },
    'frog-bubble':    { w: 30, h: 30, paint: (cx, cy) => drawFrog({ x: cx, y: cy, bob: 0.9 }) },
    'goon':   { w: 30, h: 30, paint: (cx, cy) => drawEnemy(mkEnemy('goon', cx, cy)) },
    'archer': { w: 30, h: 34, paint: (cx, cy) => withP(cx - 120, cy, 0, false, () => drawEnemy(mkEnemy('archer', cx, cy + 2))) },
    'brute':  { w: 42, h: 42, paint: (cx, cy) => drawEnemy(Object.assign(mkEnemy('brute', cx, cy), { hp: 1 })) },
    'fly':  { w: 14, h: 12, paint: (cx, cy) => drawFly({ x: cx, y: cy + 1, wob: 0.05 }) },
    'bolt': { w: 18, h: 18, paint: (cx, cy) => drawBubble(cx, cy, 6.5, 1) },
    'door':       { w: 32, h: 32, paint: tilePaint('door', false) },
    'door-open':  { w: 32, h: 32, paint: tilePaint('door', true) },
    'exit':       { w: 32, h: 32, paint: tilePaint('exit', false) },
    'chest':      { w: 32, h: 32, paint: tilePaint('chest', false) },
    'chest-open': { w: 32, h: 32, paint: tilePaint('chest', true) },
    'cage':       { w: 32, h: 32, paint: tilePaint('cage', false) },
    'cage-open':  { w: 32, h: 32, paint: tilePaint('cage', true) },
    'tile-floor':     { w: 32, h: 32, paint: (cx, cy) => drawFloorTile(cx - 16, cy - 16, false) },
    'tile-floor-alt': { w: 32, h: 32, paint: (cx, cy) => drawFloorTile(cx - 16, cy - 16, true) },
    'tile-carpet':    { w: 32, h: 32, paint: (cx, cy) => { drawFloorTile(cx - 16, cy - 16, false); drawCarpetTile(cx - 16, cy - 16); } },
    'tile-wall':      { w: 32, h: 32, paint: (cx, cy) => drawWallTile(cx - 16, cy - 16, true) },
    'heart-full':  { w: 22, h: 20, paint: (cx, cy) => drawHeart(cx, cy + 2, true) },
    'heart-empty': { w: 22, h: 20, paint: (cx, cy) => drawHeart(cx, cy + 2, false) },
    'key': { w: 24, h: 16, paint: (cx, cy) => drawKeyGlyph(cx - 2, cy - 2) },
    'lock': { w: 22, h: 26, paint: (cx, cy) => drawPadlock(cx, cy + 1) }
  };
  function renderAssetPNG(name, scale) {
    const def = EXPORT_RENDER[name];
    if (!def) return null;
    const k = Math.max(1, scale || 1);
    const oc = document.createElement('canvas');
    oc.width = Math.round(def.w * k); oc.height = Math.round(def.h * k);
    const keep = ctx;
    ctx = oc.getContext('2d');
    ctx.scale(k, k);
    try { def.paint(def.w / 2, def.h / 2); } finally { ctx = keep; }
    return oc.toDataURL('image/png');
  }

  // ===================== boot =====================
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(1 / 30, (t - last) / 1000);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  fit();
  setScore(0);
  loadFloor(1, false);
  requestAnimationFrame(frame);

  // Dev hatch for the headless smoke test. Read-only-ish; warp is bounds-guarded.
  window.__game = {
    get floor() { return floor; },
    get hp() { return P.hp; },
    get score() { return score; },
    get frogs() { return frogCount; },
    get guests() { return guestCount; },
    get flies() { return flies.length; },
    get partySize() { return party.length; },
    get speedMul() { const n = flies.reduce((k, fl) => k + (Math.hypot(fl.x - P.x, fl.y - P.y) < 55 ? 1 : 0), 0); return Math.max(0.4, 1 - 0.15 * n); },
    get state() { return state; },
    get playerX() { return P.x; },
    get playerY() { return P.y; },
    get dancing() { return P.dancing; },
    get enemies() { return enemies.length; },
    get enemyXY() { let best = null, bd = 1e9; enemies.forEach(en => { const d = Math.hypot(en.x - P.x, en.y - P.y); if (d < bd) { bd = d; best = en; } }); return best ? { x: best.x, y: best.y, d: bd } : null; },
    get zoom() { return zoom; },
    get unlock() { return mg ? { cols: mg.g.cols, rows: mg.g.rows, key: { c: mg.g.key.c, r: mg.g.key.r }, lock: { c: mg.g.lock.c, r: mg.g.lock.r }, solution: mg.g.solution, moves: mg.moves, animating: !!mg.anim, done: mg.done } : null; },
    get guestXY() { return party.length ? { x: party[0].x, y: party[0].y } : null; },
    get partyXY() { return party.map(m => ({ kind: m.kind, x: m.x, y: m.y })); },
    warp(n) { if (n >= 1 && n <= MAPS.length) { mg = null; loadFloor(n, true); } },
    renderAsset: renderAssetPNG,
    get exportList() { return Object.keys(EXPORT_RENDER).map(n => ({ name: n, w: EXPORT_RENDER[n].w, h: EXPORT_RENDER[n].h })); }
  };
})();
</script>
</body>
